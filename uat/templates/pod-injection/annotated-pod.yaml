apiVersion: v1
kind: Pod
metadata:
  name: ${POD_NAME}
  namespace: ${NAMESPACE}
  annotations:
    lambda.microvm.auth: ${VM_NAME}
spec:
  serviceAccountName: ${SA_NAME}
  containers:
  - name: app
    image: public.ecr.aws/amazonlinux/amazonlinux:2023
    command: ["sleep", "3600"]
  restartPolicy: Never
