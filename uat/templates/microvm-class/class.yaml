apiVersion: lambda.aws.amazon.com/v1alpha1
kind: MicroVMClass
metadata:
  name: ${NAME}
  namespace: ${NAMESPACE}
spec:
  maxIdleDurationSeconds: ${MAX_IDLE}
  suspendedDurationSeconds: ${SUSPENDED_DURATION}
  autoResumeEnabled: ${AUTO_RESUME}
  maximumDurationSeconds: ${MAX_DURATION}
  description: "${DESCRIPTION}"
