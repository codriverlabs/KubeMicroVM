name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MAVEN_OPTS: '-Xmx4g'
  JAVA_VERSION: '25'

jobs:

  # ─── Publish Maven artifacts (jars + UAT suite zip) ──────────────────────

  publish-maven:
    name: Publish Maven Artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false \
            --batch-mode --no-transfer-progress

      - name: Build and deploy all modules (including UAT suite zip)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress -DskipTests deploy

      - name: Summarise published artifacts
        run: |
          echo "## Published artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Registry: \`https://maven.pkg.github.com/codriverlabs/KubeMicroVM\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Type |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`ai.codriverlabs:operator-core\` | jar |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ai.codriverlabs:operator-spi\` | jar |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ai.codriverlabs:operator-controller\` | jar |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ai.codriverlabs:operator-webhook\` | jar |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ai.codriverlabs:kubemicrovm-uat\` | zip (robot-suite) |" >> $GITHUB_STEP_SUMMARY

  # NOTE: The GitHub Release itself is created by native-build.yml's gated
  # `release` job (needs: [native-cli, manifest, helm-chart, platform-versions,
  # uat-m80]) — NOT here. Previously this workflow had its own independent
  # `release` job calling softprops/action-gh-release, which raced with
  # native-build.yml's: whichever finished first "won" the release page
  # content, and this one (finishing in ~2 min, with no UAT gate) usually
  # won over native-build.yml's complete, UAT-gated release — leaving a
  # published release with only 2 Maven-related assets and a stale
  # hardcoded "63/63 PASS" body, visible for the ~20-45 min window before
  # native-build.yml's UAT-gated release finished and overwrote it (or,
  # if that job failed, indefinitely). See commit history around v1.0.19
  # for the investigation. Do not re-add a GitHub Release step here.
