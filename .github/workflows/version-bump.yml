name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next development version (e.g., 1.1.0-SNAPSHOT)'
        required: true
        type: string

jobs:
  bump:
    name: Bump POM version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set version
        run: |
          ./mvnw versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false \
            --batch-mode --no-transfer-progress
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "**/pom.xml"
          git commit -m "chore: bump version to ${{ inputs.version }} [skip ci]"
          git push
