name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_OPTS: '-Xmx4g'

jobs:
  # ─── Tests ────────────────────────────────────────────────────────────────

  test-jvm:
    name: Test (JVM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set Maven version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false --batch-mode --no-transfer-progress
      - run: ./mvnw verify -pl operator-core,operator-spi,operator-controller,operator-webhook,operator-cli,operator-tests -am --batch-mode --no-transfer-progress

  # ─── Publish Maven artifacts to GitHub Packages ───────────────────────────

  publish-maven:
    name: Publish Maven Artifacts
    needs: test-jvm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false --batch-mode --no-transfer-progress
      - name: Deploy to GitHub Packages
        run: |
          ./mvnw deploy \
            -pl operator-core,operator-spi,operator-controller,operator-webhook,operator-cli,operator-auth-agent \
            -am -DskipTests --batch-mode --no-transfer-progress \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/codriverlabs/KubeMicroVM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Platform versions artifact ──────────────────────────────────────────
  # Generates platform-versions.properties and uploads it as a workflow artifact
  # so the release job can attach it to the GitHub Release and the notify-pro job
  # can pass the version to KubeMicroVM-PRO's community-update workflow.

  platform-versions:
    name: Platform Versions
    needs: test-jvm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Generate platform-versions.properties
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          QUARKUS_VERSION=$(grep '<quarkus.platform.version>' pom.xml \
            | sed 's/.*<quarkus.platform.version>\(.*\)<\/quarkus.platform.version>.*/\1/' | tr -d ' ')
          AWS_SDK=$(grep '<aws.sdk.version>' pom.xml \
            | sed 's/.*<aws.sdk.version>\(.*\)<\/aws.sdk.version>.*/\1/' | tr -d ' ')
          JAVA_VERSION=$(grep '<maven.compiler.release>' pom.xml \
            | sed 's/.*<maven.compiler.release>\(.*\)<\/maven.compiler.release>.*/\1/' | tr -d ' ')
          cat > platform-versions.properties <<EOF
          community.version=${VERSION}
          quarkus.platform.version=${QUARKUS_VERSION}
          aws.sdk.version=${AWS_SDK}
          java.version=${JAVA_VERSION}
          EOF
          # Strip leading whitespace from heredoc indentation
          sed -i 's/^[[:space:]]*//' platform-versions.properties
          echo "Generated platform-versions.properties:"
          cat platform-versions.properties
      - uses: actions/upload-artifact@v7
        with:
          name: platform-versions
          path: platform-versions.properties
          retention-days: 7



  native-cli:
    name: Native CLI (${{ matrix.arch }})
    needs: test-jvm
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            os: linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            os: linux
          - arch: arm64
            runner: macos-14
            os: darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: mandrel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build native CLI
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            ./mvnw versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false --batch-mode --no-transfer-progress
          fi
          ./mvnw package -pl operator-cli -am -Dnative -DskipTests \
            --batch-mode --no-transfer-progress \
            -Dquarkus.native.container-build=false
      - name: Rename binary
        run: |
          BINARY=$(find operator-cli/target -name "*-runner" -type f | head -1)
          cp "$BINARY" microvm-${{ matrix.os }}-${{ matrix.arch }}
          chmod +x microvm-${{ matrix.os }}-${{ matrix.arch }}
          file microvm-${{ matrix.os }}-${{ matrix.arch }}
      - name: Smoke test
        run: timeout 5 ./microvm-${{ matrix.os }}-${{ matrix.arch }} --help || true
      - uses: actions/upload-artifact@v7
        with:
          name: microvm-${{ matrix.os }}-${{ matrix.arch }}
          path: microvm-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  # ─── Container images (per arch) ─────────────────────────────────────────
  # Builds native container images for operator + auth-agent per arch.

  container-image:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: test-jvm
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            image: kube-microvm-operator
            dockerfile: Dockerfile
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: kube-microvm-operator
            dockerfile: Dockerfile
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            image: microvm-auth-agent
            dockerfile: Dockerfile.auth-agent
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: microvm-auth-agent
            dockerfile: Dockerfile.auth-agent
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  # ─── Multi-arch manifests ─────────────────────────────────────────────────

  manifest:
    name: Manifest (${{ matrix.image }})
    needs: container-image
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        image: [kube-microvm-operator, microvm-auth-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${{ matrix.image }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            MAJOR="${VERSION%%.*}"; MINOR="${VERSION%.*}"
            if [[ "${GITHUB_REF_NAME}" == *-rc* || "${GITHUB_REF_NAME}" == *-beta* || "${GITHUB_REF_NAME}" == *-alpha* ]]; then
              # Pre-release: only version tag, no latest/major/minor
              TAGS="${IMAGE}:${VERSION}"
            else
              # GA release: version + minor + major + latest
              TAGS="${IMAGE}:${VERSION} ${IMAGE}:${MINOR} ${IMAGE}:${MAJOR} ${IMAGE}:latest"
            fi
            SHA_TAG="${VERSION}"
          else
            SHA="${GITHUB_SHA::8}"
            TAGS="${IMAGE}:${SHA}"
            [[ "${GITHUB_REF}" == refs/heads/main ]] && TAGS="${TAGS} ${IMAGE}:main"
            SHA_TAG="${SHA}"
          fi
          AMD="${IMAGE}:${SHA_TAG}-amd64"
          ARM="${IMAGE}:${SHA_TAG}-arm64"
          # imagetools creates a proper multi-arch manifest from existing per-arch images
          # Works correctly even when per-arch tags are themselves manifest lists
          for TAG in ${TAGS}; do
            docker buildx imagetools create -t "${TAG}" "${AMD}" "${ARM}"
          done

  # ─── Helm chart ───────────────────────────────────────────────────────────

  helm-chart:
    name: Helm Chart
    needs: test-jvm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Helm chart to GHCR OCI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Quarkus Helm generates the chart with image tag and version baked in.
          # Auth-agent image is pinned to the release version via the kubernetes env var,
          # NOT via quarkus.helm.values.* — the latter targets a path inside the container
          # env array, which quarkus.helm.expressions.0 replaces wholesale, so the override
          # is silently inert and the chart ships ':latest'.
          # See docs/design/pro-artifact-consumability.md
          ./mvnw -B -pl operator-core,operator-spi,operator-webhook,operator-controller \
            package -DskipTests --no-transfer-progress \
            -Dquarkus.helm.version=${VERSION} \
            -Dquarkus.helm.create-tar-file=true \
            -Dquarkus.container-image.tag=${VERSION} \
            -Dquarkus.container-image.build=false \
            -Dquarkus.kubernetes.env.vars.MICROVM_AUTH_AGENT_IMAGE=ghcr.io/codriverlabs/microvm-auth-agent:${VERSION}
          CHART_DIR="operator-controller/target/helm/kubernetes/kube-microvm-operator"
          # Guard: the auth-agent sidecar must be pinned to the release version, not ':latest'.
          # This shipped broken in every release up to v1.0.15 with no signal.
          if ! grep -q "microvm-auth-agent:${VERSION}" "${CHART_DIR}/values.yaml"; then
            echo "::error::auth-agent image not pinned to ${VERSION} in chart values.yaml"
            grep -n 'microvm-auth-agent' "${CHART_DIR}/values.yaml" || true
            exit 1
          fi
          # Re-package with correct version metadata
          rm -f "${CHART_DIR}/../kube-microvm-operator-${VERSION}.tar.gz"
          helm package "${CHART_DIR}" --version "${VERSION}" --app-version "${VERSION}" \
            -d operator-controller/target/helm/kubernetes/
          helm push operator-controller/target/helm/kubernetes/kube-microvm-operator-${VERSION}.tgz \
            oci://ghcr.io/${OWNER}/helm
      - uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: operator-controller/target/helm/kubernetes/kube-microvm-operator-*.tgz
          retention-days: 1

  # ─── GitHub Release ───────────────────────────────────────────────────────

  release:
    name: GitHub Release
    needs: [native-cli, manifest, helm-chart, platform-versions]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: microvm-linux-amd64
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: microvm-linux-arm64
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: microvm-darwin-arm64
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: helm-chart
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: platform-versions
          path: dist/
      - name: Generate checksums
        working-directory: dist
        run: |
          # Individual .sha256 per artifact
          for f in microvm-linux-amd64 microvm-linux-arm64 microvm-darwin-arm64 kube-microvm-operator-*.tgz platform-versions.properties; do
            sha256sum "$f" > "$f.sha256"
          done
          # Combined checksums.sha256
          sha256sum microvm-linux-amd64 microvm-linux-arm64 microvm-darwin-arm64 kube-microvm-operator-*.tgz platform-versions.properties > checksums.sha256
      - uses: actions/checkout@v7
        with:
          path: repo
      - name: Checksum installer and IAM template
        run: |
          sha256sum repo/install_kube_microvm.sh > install_kube_microvm.sh.sha256
          sha256sum repo/iam/kube-microvm-operator-role.yaml > kube-microvm-operator-role.yaml.sha256
          # Append to combined checksums
          sha256sum repo/install_kube_microvm.sh repo/iam/kube-microvm-operator-role.yaml >> dist/checksums.sha256
      - name: Determine if pre-release
        id: prerelease
        run: echo "value=${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.value == 'true' }}
          files: |
            dist/microvm-linux-amd64
            dist/microvm-linux-amd64.sha256
            dist/microvm-linux-arm64
            dist/microvm-linux-arm64.sha256
            dist/microvm-darwin-arm64
            dist/microvm-darwin-arm64.sha256
            dist/kube-microvm-operator-*.tgz
            dist/kube-microvm-operator-*.tgz.sha256
            dist/platform-versions.properties
            dist/platform-versions.properties.sha256
            dist/checksums.sha256
            install_kube_microvm.sh.sha256
            kube-microvm-operator-role.yaml.sha256
            repo/install_kube_microvm.sh
            repo/iam/kube-microvm-operator-role.yaml

  # ─── Notify PRO of Community release ─────────────────────────────────────
  # Triggers KubeMicroVM-PRO's community-update.yml workflow, which validates
  # PRO compatibility against the newly published Community jars.
  #
  # Fires on every release tag (including RC/beta/alpha) so PRO can catch
  # breaking changes before GA. GA releases also update PRO's pinned version.
  #
  # Requires a fine-grained PAT or classic PAT with contents:write on
  # plasticity-of-cloud/KubeMicroVM-PRO stored as secret PRO_DISPATCH_TOKEN.

  notify-pro:
    name: Notify KubeMicroVM-PRO
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch community-release event to KubeMicroVM-PRO
        env:
          PRO_DISPATCH_TOKEN: ${{ secrets.PRO_DISPATCH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "${PRO_DISPATCH_TOKEN}" ]]; then
            echo "::warning::PRO_DISPATCH_TOKEN is not set — skipping KubeMicroVM-PRO notification."
            echo "Add a fine-grained PAT with contents:write on plasticity-of-cloud/KubeMicroVM-PRO"
            echo "as repository secret PRO_DISPATCH_TOKEN to enable automatic PRO validation."
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o /tmp/dispatch-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PRO_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/plasticity-of-cloud/KubeMicroVM-PRO/dispatches \
            -d "{\"event_type\":\"community-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}")
          if [[ "${HTTP_STATUS}" == "204" ]]; then
            echo "✅ Dispatched community-release event to KubeMicroVM-PRO for v${VERSION}"
          else
            echo "::error::Dispatch failed with HTTP ${HTTP_STATUS}"
            cat /tmp/dispatch-response.json
            exit 1
          fi
