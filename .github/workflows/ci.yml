name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'
      - '.github/**'
      - 'uat/**'
      - 'context.md'
      - 'LICENSE.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_OPTS: '-Xmx4g'

jobs:
  # ─── Tests ────────────────────────────────────────────────────────────────

  test-jvm:
    name: Test (JVM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw verify -pl operator-core,operator-spi,operator-controller,operator-webhook,operator-cli,operator-tests -am --batch-mode --no-transfer-progress

      # Guards the PRO consumption contract. ArC only scans a dependency jar for CDI
      # beans if it carries META-INF/jandex.idx. operator-controller in particular is an
      # application module here but a plain dependency to KubeMicroVM-PRO, and without an
      # index the PRO operator silently loses every Community reconciler and Default* SPI
      # bean — with a green build on both sides.
      # See docs/design/pro-artifact-consumability.md
      - name: Verify published jars carry a Jandex index
        run: |
          status=0
          for m in operator-core operator-spi operator-controller operator-webhook; do
            jar=$(find "$m/target" -maxdepth 1 -name "$m-*.jar" ! -name '*-sources.jar' \
                    ! -name '*-javadoc.jar' | head -1)
            if [ -z "$jar" ]; then
              echo "::error::no jar built for $m"; status=1; continue
            fi
            if unzip -l "$jar" | grep -q 'META-INF/jandex.idx'; then
              echo "ok      $m ($(basename "$jar"))"
            else
              echo "::error::$m is published without META-INF/jandex.idx"; status=1
            fi
          done
          exit $status

      # Guards the inert-Helm-mapping class of bug (see the same design doc). Asserts the
      # auth-agent image can actually be pinned at chart build time and overridden at
      # install time — both were silently broken through v1.0.15.
      - name: Verify Helm chart pins the auth-agent image
        run: |
          ./mvnw -B -q -pl operator-core,operator-spi,operator-webhook,operator-controller \
            package -DskipTests --no-transfer-progress \
            -Dquarkus.container-image.build=false \
            -Dquarkus.kubernetes.env.vars.MICROVM_AUTH_AGENT_IMAGE=ghcr.io/codriverlabs/microvm-auth-agent:9.9.9
          CHART="operator-controller/target/helm/kubernetes/kube-microvm-operator"

          grep -q 'microvm-auth-agent:9.9.9' "$CHART/values.yaml" \
            || { echo "::error::build-time pin absent from values.yaml"; \
                 grep -n 'auth-agent' "$CHART/values.yaml"; exit 1; }

          helm template t "$CHART" | grep -A1 'MICROVM_AUTH_AGENT_IMAGE' | grep -q '9.9.9' \
            || { echo "::error::build-time pin not rendered into the Deployment"; exit 1; }

          helm template t "$CHART" \
            --set app.envs.MICROVM_AUTH_AGENT_IMAGE=my.registry/agent:5.5.5 \
            | grep -q 'my.registry/agent:5.5.5' \
            || { echo "::error::install-time override does not render"; exit 1; }

          grep -q 'authAgentImage' "$CHART/values.yaml" \
            && { echo "::error::dead authAgentImage key still emitted"; exit 1; }

          echo "ok: auth-agent image pinned at build time and overridable at install time"

  # ─── Native CLI binary (arm64) ────────────────────────────────────────────

  native-cli:
    name: Native CLI (arm64)
    needs: test-jvm
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: mandrel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build native CLI
        run: |
          ./mvnw install -pl operator-core,operator-spi,operator-controller -am -DskipTests --batch-mode --no-transfer-progress -q
          ./mvnw package -pl operator-cli -Pnative -DskipTests --batch-mode --no-transfer-progress
      - name: Verify binary
        run: |
          ls -lh operator-cli/target/*-runner
          file operator-cli/target/*-runner

  # ─── Container images (arm64) ─────────────────────────────────────────────

  container-images:
    name: ${{ matrix.image }} (arm64)
    needs: test-jvm
    strategy:
      matrix:
        include:
          - image: kube-microvm-operator
            dockerfile: Dockerfile
          - image: microvm-auth-agent
            dockerfile: Dockerfile.auth-agent
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tag
        id: tag
        run: echo "value=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-arm64
