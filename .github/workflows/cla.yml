name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: |
      (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # Pin to Node 20 — contributor-assistant/github-action is unmaintained
          # and crashes on Node 24 (punycode deprecation + undefined 'some' error).
          # TODO: Replace with a maintained CLA action when available.
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_PAT }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/codriverlabs/KubeMicroVM/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'bot*,dependabot*,renovate*'
          custom-notsigned-prcomment: |
            Thank you for your Pull Request! 🎉

            Before we can merge this, you need to sign our [Contributor License Agreement](https://github.com/codriverlabs/KubeMicroVM/blob/main/CLA.md).

            **To sign**, please comment below with:

            > I have read the CLA Document and I hereby sign the CLA

            This is a one-time requirement. The CLA grants us permission to include your contribution in all editions of KubeMicroVM while you retain full copyright ownership.
          custom-allsigned-prcomment: |
            All contributors have signed the CLA. ✅
