# CLA Assistant — DISABLED
#
# contributor-assistant/github-action@v2.6.1 was archived on 2026-03-23 and has
# an unfixed runtime bug ("Cannot read properties of undefined (reading 'some')")
# that crashes regardless of Node version.
#
# TODO: Replace with SAP's hosted CLA Assistant (cla-assistant.io) or a custom
#       lightweight solution before accepting external contributions.
#
# Previously configured to:
# - Skip CLA for org owners (author_association == OWNER)
# - Allow only dependabot[bot] to bypass
# - Store signatures in signatures/cla.json
#
name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Disabled — action is archived and crashes at runtime.
    if: false
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_PAT }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/codriverlabs/KubeMicroVM/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot]'
          custom-notsigned-prcomment: |
            Thank you for your Pull Request! 🎉

            Before we can merge this, you need to sign our [Contributor License Agreement](https://github.com/codriverlabs/KubeMicroVM/blob/main/CLA.md).

            **To sign**, please comment below with:

            > I have read the CLA Document and I hereby sign the CLA

            This is a one-time requirement. The CLA grants us permission to include your contribution in all editions of KubeMicroVM while you retain full copyright ownership.
          custom-allsigned-prcomment: |
            All contributors have signed the CLA. ✅
