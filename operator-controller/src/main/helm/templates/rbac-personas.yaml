---
# User-facing RBAC personas for MicroVM resources.
# These ClusterRoles can be bound to users/groups/service accounts to grant
# standardised access levels to MicroVM resources.
#
# Usage:
#   kubectl create rolebinding dev-microvm-writer \
#     --clusterrole=microvm-writer --user=developer@example.com -n my-namespace
---
# microvm-reader: read-only access to all MicroVM resources and status
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: microvm-reader
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    rbac.kubemicrovm.io/aggregate-to-reader: "true"
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["lambda.aws.amazon.com"]
  resources:
  - microvms
  - microvmimages
  - microvmreplicasets
  - microvmnetworks
  - microvmclasses
  verbs: ["get", "list", "watch"]
- apiGroups: ["lambda.aws.amazon.com"]
  resources:
  - microvms/status
  - microvmimages/status
  - microvmreplicasets/status
  - microvmnetworks/status
  verbs: ["get"]
---
# microvm-writer: full CRUD on MicroVM resources (create, update, delete, patch)
# Does NOT include token creation — use microvm-token-requester for that.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: microvm-writer
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    rbac.kubemicrovm.io/aggregate-to-writer: "true"
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["lambda.aws.amazon.com"]
  resources:
  - microvms
  - microvmimages
  - microvmreplicasets
  - microvmnetworks
  - microvmclasses
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["lambda.aws.amazon.com"]
  resources:
  - microvms/status
  - microvmimages/status
  - microvmreplicasets/status
  - microvmnetworks/status
  verbs: ["get"]
