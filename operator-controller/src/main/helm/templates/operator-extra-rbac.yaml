---
# Operator token endpoint RBAC — allows the operator SA to perform
# TokenReview and SubjectAccessReview (needed for in-cluster token endpoint).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-microvm-operator-token-auth-role
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-microvm-operator-token-auth-binding
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: kube-microvm-operator
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: kube-microvm-operator-token-auth-role
  apiGroup: rbac.authorization.k8s.io
---
# Operator webhook RBAC — allows the operator SA to perform namespace permission
# checks, quota lookups, and MicroVMClass lookups during admission validation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-microvm-operator-webhook-role
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["resourcequotas"]
  verbs: ["list"]
- apiGroups: ["lambda.aws.amazon.com"]
  resources: ["microvmclasses"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-microvm-operator-webhook-binding
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: kube-microvm-operator
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: kube-microvm-operator-webhook-role
  apiGroup: rbac.authorization.k8s.io

---
# Leader election RBAC — allows the operator to create and manage Lease objects.
# Required for HA (multi-replica) deployments. JOSDK checks for this at startup.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-microvm-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create", "update", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-microvm-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: kube-microvm-operator
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: kube-microvm-operator-leader-election
  apiGroup: rbac.authorization.k8s.io

---
# CA distribution RBAC — allows the operator to replicate its CA cert
# to managed namespaces for auth-agent TLS verification.
# The operator creates/updates a single Secret named "kube-microvm-operator-ca"
# in namespaces labelled lambda.aws.amazon.com/manage-microvms=true.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-microvm-operator-ca-distributor
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
  # Read/update/delete the specific CA Secret by name only
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kube-microvm-operator-ca"]
    verbs: ["get", "update", "patch", "delete"]
  # Create secrets in managed namespaces (resourceNames cannot restrict create)
  # The operator code only ever creates the named Secret above.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-microvm-operator-ca-distributor
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: kube-microvm-operator
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: kube-microvm-operator-ca-distributor
  apiGroup: rbac.authorization.k8s.io
