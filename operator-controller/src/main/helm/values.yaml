fullnameOverride: ""

# Leader election for HA deployments (multiple replicas).
# Enabled automatically in production profile (Quarkus 'prod' profile).
# Disabled in dev/test profiles. No configuration needed for default behaviour.
# To disable in production: --set app.envs.QUARKUS_OPERATOR_SDK_ACTIVATE_LEADER_ELECTION_FOR_PROFILES=""

# Sidecar image for auto-injected microvm-auth-agent.
# Override via: --set app.envs.MICROVM_AUTH_AGENT_IMAGE=<repo>:<tag>
# Default is set at chart build time to match the operator version.
# Set to your private ECR image when using a private registry:
#   --set app.envs.MICROVM_AUTH_AGENT_IMAGE=123456789012.dkr.ecr.us-east-1.amazonaws.com/codriverlabs/microvm-auth-agent:1.0.7

# AWS API quota guard — rate limits matching your account's service quotas.
# These are passed to the operator as environment variables via app.envs.*
# The install script auto-discovers actual values via `aws service-quotas get-service-quota`
# and overrides at install time with --set app.envs.AWS_QUOTA_RUN_MICROVM_RATE=<value>.
#
# Defaults (us-east-1):
#   app.envs.AWS_QUOTA_RUN_MICROVM_RATE: 5
#   app.envs.AWS_QUOTA_TERMINATE_MICROVM_RATE: 10
#   app.envs.AWS_QUOTA_SUSPEND_MICROVM_RATE: 2
#   app.envs.AWS_QUOTA_RESUME_MICROVM_RATE: 5
#   app.envs.AWS_QUOTA_GET_MICROVM_RATE: 100
#   app.envs.AWS_QUOTA_AUTH_TOKEN_RATE: 50
#   app.envs.AWS_QUOTA_SHELL_AUTH_TOKEN_RATE: 5
#   app.envs.AWS_QUOTA_CONCURRENT_IMAGE_BUILDS: 10
#   app.envs.AWS_QUOTA_TOKEN_QUEUE_SIZE: 200
#   app.envs.AWS_QUOTA_DISCOVERY_ENABLED: false
