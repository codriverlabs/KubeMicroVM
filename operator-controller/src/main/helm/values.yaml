fullnameOverride: ""

serviceAccount:
  # For IRSA: set to the IAM role ARN (e.g. arn:aws:iam::123456789012:role/kube-microvm-operator)
  # For EKS Pod Identity (recommended): leave empty and create a PodIdentityAssociation
  irsaRoleArn: ""

webhook:
  enabled: true
  certManager:
    enabled: true
    issuerRef:
      name: selfsigned-issuer
      kind: ClusterIssuer

networkPolicy:
  enabled: false

# Token injection Phase 2 — operator token sub-resource endpoint
tokenEndpoint:
  enabled: true
  maxExpiryMinutes: 60

# Sidecar image for auto-injected microvm-auth-agent
# Injected into pods annotated with lambda.microvm.auth: <vm-name>
authAgent:
  image:
    repository: ghcr.io/plasticity-of-cloud/microvm-auth-agent
    tag: latest

# AWS API quota guard — rate limits matching your account's service quotas.
# Defaults match AWS account-level defaults exactly.
# The install script auto-discovers actual values via `aws service-quotas get-service-quota`
# and overrides these at install time.
# Enable runtime discovery with quotas.discoveryEnabled=true (requires additional IAM permission).
quotas:
  # RunMicrovm burst rate (req/s). AWS default: 5.
  runMicrovmRate: 5
  # TerminateMicrovm burst rate (req/s). AWS default: 10.
  terminateMicrovmRate: 10
  # SuspendMicrovm burst rate (req/s). AWS default: 2.
  suspendMicrovmRate: 2
  # ResumeMicrovm burst rate (req/s). AWS default: 5.
  resumeMicrovmRate: 5
  # GetMicrovm burst rate (req/s). AWS default: 100.
  getMicrovmRate: 100
  # CreateMicrovmAuthToken burst rate (req/s). AWS default: 50.
  authTokenRate: 50
  # CreateMicrovmShellAuthToken burst rate (req/s). AWS default: 5.
  shellAuthTokenRate: 5
  # Concurrent image builds. AWS default: 10.
  concurrentImageBuilds: 10
  # Max in-flight token requests before returning HTTP 429. Not an AWS quota.
  tokenQueueSize: 200
  # Enable runtime quota discovery via AWS Service Quotas API.
  # Requires service-quotas:GetServiceQuota IAM permission on the operator role.
  discoveryEnabled: false
