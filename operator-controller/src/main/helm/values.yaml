fullnameOverride: ""

serviceAccount:
  # For IRSA: set to the IAM role ARN (e.g. arn:aws:iam::123456789012:role/kube-microvm-operator)
  # For EKS Pod Identity (recommended): leave empty and create a PodIdentityAssociation
  irsaRoleArn: ""

webhook:
  enabled: true
  certManager:
    enabled: true
    issuerRef:
      name: selfsigned-issuer
      kind: ClusterIssuer

networkPolicy:
  enabled: false

# Token injection Phase 2 — operator token sub-resource endpoint
tokenEndpoint:
  enabled: true
  maxExpiryMinutes: 60

# Sidecar image for auto-injected microvm-auth-agent
# Injected into pods annotated with lambda.microvm.auth: <vm-name>
authAgent:
  image:
    repository: ghcr.io/plasticity-of-cloud/microvm-auth-agent
    tag: latest

# AWS API quota guard — rate limits matching your account's service quotas.
# Defaults match AWS account-level defaults (conservative: 90% of quota).
# If you have received a quota increase from AWS Support, raise these values.
quotas:
  # RunMicrovm rate (req/s). AWS default: 5. Set to 90% = 4.
  runMicrovmRate: 4
  # TerminateMicrovm rate (req/s). AWS default: 10. Set to 90% = 9.
  terminateMicrovmRate: 9
  # SuspendMicrovm rate (req/s). AWS default: 2. Set to 90% = 1.
  suspendMicrovmRate: 1
  # ResumeMicrovm rate (req/s). AWS default: 5. Set to 90% = 4.
  resumeMicrovmRate: 4
  # GetMicrovm rate (req/s). AWS default: 100. Set to 90% = 90.
  getMicrovmRate: 90
  # CreateMicrovmAuthToken rate (req/s). AWS default: 50. Set to 90% = 45.
  authTokenRate: 45
  # CreateMicrovmShellAuthToken rate (req/s). AWS default: 5. Set to 90% = 4.
  shellAuthTokenRate: 4
  # Concurrent image builds. AWS default: 10. Set to 90% = 9.
  concurrentImageBuilds: 9
  # Max in-flight token requests before returning HTTP 429. Not an AWS quota.
  tokenQueueSize: 200
