---
# Token requester ClusterRole — grants pods permission to call the operator's
# token sub-resource (POST .../microvms/{name}/token) without AWS credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: microvm-token-requester
rules:
- apiGroups: ["lambda.aws.amazon.com"]
  resources: ["microvms/token"]
  verbs: ["create"]
---
# Operator token endpoint RBAC — allows the operator SA to perform
# TokenReview and SubjectAccessReview (needed for in-cluster token endpoint).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-microvm-operator-token-auth-role
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-microvm-operator-token-auth-binding
subjects:
- kind: ServiceAccount
  name: kube-microvm-operator
  namespace: kube-microvm
roleRef:
  kind: ClusterRole
  name: kube-microvm-operator-token-auth-role
  apiGroup: rbac.authorization.k8s.io
---
# Operator webhook RBAC — allows the operator SA to read namespaces,
# resourcequotas, and microvmclasses during admission validation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-microvm-operator-webhook-role
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["resourcequotas"]
  verbs: ["list"]
- apiGroups: ["lambda.aws.amazon.com"]
  resources: ["microvmclasses"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-microvm-operator-webhook-binding
subjects:
- kind: ServiceAccount
  name: kube-microvm-operator
  namespace: kube-microvm
roleRef:
  kind: ClusterRole
  name: kube-microvm-operator-webhook-role
  apiGroup: rbac.authorization.k8s.io
---
# cert-manager: SelfSigned Issuer (namespace-scoped, bootstraps the CA)
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kube-microvm-operator-selfsigned
  namespace: kube-microvm
spec:
  selfSigned: {}
---
# cert-manager: CA Certificate (self-signed root)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kube-microvm-operator-ca
  namespace: kube-microvm
spec:
  isCA: true
  commonName: kube-microvm-operator-ca
  secretName: kube-microvm-operator-ca
  issuerRef:
    name: kube-microvm-operator-selfsigned
    kind: Issuer
  duration: 87600h
  renewBefore: 720h
---
# cert-manager: CA Issuer (signs leaf certs using the CA)
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kube-microvm-operator-ca
  namespace: kube-microvm
spec:
  ca:
    secretName: kube-microvm-operator-ca
---
# cert-manager: Leaf Certificate for webhook TLS (issued by the CA)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kube-microvm-operator-webhook-tls
  namespace: kube-microvm
spec:
  secretName: kube-microvm-operator-webhook-tls
  dnsNames:
  - kube-microvm-operator.kube-microvm.svc
  - kube-microvm-operator.kube-microvm.svc.cluster.local
  issuerRef:
    name: kube-microvm-operator-ca
    kind: Issuer
  duration: 8760h
  renewBefore: 720h
---
# MutatingWebhookConfiguration — MicroVM spec defaulting + pod token injection
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kube-microvm-operator-mutating
  annotations:
    cert-manager.io/inject-ca-from: kube-microvm/kube-microvm-operator-webhook-tls
webhooks:
- name: mutate.microvms.lambda.aws.amazon.com
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Ignore
  clientConfig:
    service:
      name: kube-microvm-operator
      namespace: kube-microvm
      path: /mutate-microvm
      port: 443
  rules:
  - apiGroups: ["lambda.aws.amazon.com"]
    apiVersions: ["v1alpha1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["microvms"]
- name: pod-inject.lambda.aws.amazon.com
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Ignore
  clientConfig:
    service:
      name: kube-microvm-operator
      namespace: kube-microvm
      path: /mutate-pod
      port: 443
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
  namespaceSelector:
    matchLabels:
      lambda.microvm.auth/inject: "enabled"
---
# ValidatingWebhookConfiguration — MicroVM/Image/Network validation
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-microvm-operator-validating
  annotations:
    cert-manager.io/inject-ca-from: kube-microvm/kube-microvm-operator-webhook-tls
webhooks:
- name: validate.microvms.lambda.aws.amazon.com
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: kube-microvm-operator
      namespace: kube-microvm
      path: /validate-microvm
      port: 443
  rules:
  - apiGroups: ["lambda.aws.amazon.com"]
    apiVersions: ["v1alpha1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["microvms", "microvmimages", "microvmnetworks"]
---
# CA distribution RBAC — allows the operator to replicate its CA cert
# to managed namespaces for auth-agent TLS verification.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-microvm-operator-ca-distributor
rules:
  # List namespaces to find managed ones (labelled with manage-microvms=true)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  # Read/update/delete the specific CA Secret by name only
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kube-microvm-operator-ca"]
    verbs: ["get", "update", "patch", "delete"]
  # Create secrets in managed namespaces (resourceNames cannot restrict create)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-microvm-operator-ca-distributor
subjects:
- kind: ServiceAccount
  name: kube-microvm-operator
  namespace: kube-microvm
roleRef:
  kind: ClusterRole
  name: kube-microvm-operator-ca-distributor
  apiGroup: rbac.authorization.k8s.io
---
# Leader election RBAC — allows the operator to create and manage Lease objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-microvm-operator-leader-election
  namespace: kube-microvm
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create", "update", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-microvm-operator-leader-election
  namespace: kube-microvm
subjects:
- kind: ServiceAccount
  name: kube-microvm-operator
  namespace: kube-microvm
roleRef:
  kind: Role
  name: kube-microvm-operator-leader-election
  apiGroup: rbac.authorization.k8s.io
---
# Shared ClusterRole for MicroVMGateway proxy pods.
#
# Every gateway SA needs TokenReview and SubjectAccessReview to validate
# incoming requests. These APIs are cluster-scoped — a namespace Role cannot
# grant them. Rather than creating one identical ClusterRole per gateway
# (N gateways → N ClusterRoles), a single shared ClusterRole is installed
# once by the Helm chart.
#
# The MicroVMGatewayReconciler creates a ClusterRoleBinding per gateway
# binding the gateway SA to this shared ClusterRole.
#
# Security: TokenReview and SubjectAccessReview are observer-only auth query
# APIs (same as system:auth-delegator). They cannot read, write, or modify
# any resources. The meaningful isolation boundary is the namespace-scoped
# Role that restricts microvms/token access to the gateway's own namespace.
#
# See: KubeMicroVM-PRO/docs/design/gateway-rbac.md
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: microvm-gateway-auth
  labels:
    app.kubernetes.io/name: kube-microvm-operator
    app.kubernetes.io/component: gateway-auth
    app.kubernetes.io/managed-by: kube-microvm-operator
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
# ClusterIssuer backed by the operator CA certificate.
#
# post-install hook so cert-manager processes the Certificate CR first and
# creates the CA Secret before the ClusterIssuer is validated.
# See docs/design/ca-distribution.md.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kube-microvm-operator-ca
  labels:
    app.kubernetes.io/name: kube-microvm-operator
    app.kubernetes.io/component: pki
    app.kubernetes.io/managed-by: kube-microvm-operator
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ca:
    secretName: kube-microvm-operator-ca
