# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
aws.microvm.thread-pool-size=10
# VPC endpoint override for Lambda MicroVMs API (required in private subnets)
# Use https://lambda-microvm.<region>.on.aws when running behind VPC endpoint
# AWS API quota guard — configurable rate limits (req/s) matching AWS account defaults.
# Increase these values if you have received a quota increase from AWS Support.
# Set via Helm --set quotas.* or install script --quota-* flags.
aws.quota.run-microvm-rate=${AWS_QUOTA_RUN_MICROVM_RATE:4}
aws.quota.terminate-microvm-rate=${AWS_QUOTA_TERMINATE_MICROVM_RATE:9}
aws.quota.suspend-microvm-rate=${AWS_QUOTA_SUSPEND_MICROVM_RATE:1}
aws.quota.resume-microvm-rate=${AWS_QUOTA_RESUME_MICROVM_RATE:4}
aws.quota.get-microvm-rate=${AWS_QUOTA_GET_MICROVM_RATE:90}
aws.quota.auth-token-rate=${AWS_QUOTA_AUTH_TOKEN_RATE:45}
aws.quota.shell-auth-token-rate=${AWS_QUOTA_SHELL_AUTH_TOKEN_RATE:4}
aws.quota.concurrent-image-builds=${AWS_QUOTA_CONCURRENT_IMAGE_BUILDS:9}
aws.quota.token-queue-size=${AWS_QUOTA_TOKEN_QUEUE_SIZE:200}
aws.microvm.endpoint=${AWS_MICROVM_ENDPOINT:}

# Quarkus Operator SDK
quarkus.operator-sdk.start-operator=true

# Health
quarkus.smallrye-health.root-path=/q/health

# HTTP + TLS
quarkus.http.port=8080
quarkus.http.ssl-port=8443
# Keep HTTP port open for health probes while serving webhooks on HTTPS
quarkus.http.insecure-requests=enabled
# cert-manager injects TLS certs via volume mount
quarkus.http.ssl.certificate.files=/tls/tls.crt
quarkus.http.ssl.certificate.key-files=/tls/tls.key
# Dev/test: disable TLS (no cert-manager available)
%dev.quarkus.http.ssl.certificate.files=
%dev.quarkus.http.ssl.certificate.key-files=
%test.quarkus.http.ssl.certificate.files=
%test.quarkus.http.ssl.certificate.key-files=

# Logging
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}

# Container image
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=plasticity-of-cloud
quarkus.container-image.name=kube-microvm-operator
quarkus.container-image.tag=latest
quarkus.container-image.docker.dockerfile-native-path=src/main/docker/Dockerfile.native
quarkus.container-image.docker.dockerfile-jvm-path=src/main/docker/Dockerfile.jvm

# Kubernetes manifest generation
quarkus.kubernetes.name=kube-microvm-operator
quarkus.kubernetes.namespace=kube-microvm
quarkus.kubernetes.service-type=ClusterIP
quarkus.kubernetes.replicas=1
quarkus.kubernetes.service-account=kube-microvm-operator
quarkus.kubernetes.liveness-probe.http-action-path=/q/health/live
quarkus.kubernetes.liveness-probe.initial-delay=5s
quarkus.kubernetes.readiness-probe.http-action-path=/q/health/ready
quarkus.kubernetes.readiness-probe.initial-delay=10s
quarkus.kubernetes.startup-probe.http-action-path=/q/health/started
quarkus.kubernetes.startup-probe.initial-delay=2s
quarkus.kubernetes.startup-probe.failure-threshold=6
quarkus.kubernetes.startup-probe.period=5s
quarkus.kubernetes.env.vars.AWS_REGION=us-east-1
quarkus.kubernetes.env.vars.QUARKUS_LOG_LEVEL=INFO
quarkus.kubernetes.resources.requests.cpu=100m
quarkus.kubernetes.resources.requests.memory=256Mi
quarkus.kubernetes.resources.limits.cpu=500m
quarkus.kubernetes.resources.limits.memory=512Mi
quarkus.kubernetes.image-pull-policy=Always
# TLS cert volume from cert-manager Secret
quarkus.kubernetes.secret-volumes."tls-certs".secret-name=kube-microvm-operator-webhook-tls
quarkus.kubernetes.secret-volumes."tls-certs".default-mode=0644
quarkus.kubernetes.mounts."tls-certs".path=/tls
quarkus.kubernetes.mounts."tls-certs".read-only=true

# Token endpoint config
microvm.token.max-expiry-minutes=60
microvm.webhook.agent-image=${MICROVM_AUTH_AGENT_IMAGE:ghcr.io/plasticity-of-cloud/microvm-auth-agent:latest}

# Helm chart generation (quarkus-helm)
quarkus.helm.name=kube-microvm-operator
quarkus.helm.description=Kubernetes operator for AWS Lambda MicroVMs
quarkus.helm.create-tar-file=true
quarkus.helm.notes=templates/NOTES.txt
quarkus.helm.values.replicas.paths=(kind == Deployment).spec.replicas
quarkus.helm.values.replicas.value-as-int=1
# Map Helm quotas.* values to operator env vars
quarkus.helm.values.quotas.runMicrovmRate.paths=(kind == Deployment).spec.template.spec.containers.(name == kube-microvm-operator).env.(name == AWS_QUOTA_RUN_MICROVM_RATE).value
quarkus.helm.values.quotas.runMicrovmRate.value=4
quarkus.helm.values.quotas.terminateMicrovmRate.paths=(kind == Deployment).spec.template.spec.containers.(name == kube-microvm-operator).env.(name == AWS_QUOTA_TERMINATE_MICROVM_RATE).value
quarkus.helm.values.quotas.terminateMicrovmRate.value=9
quarkus.helm.values.quotas.suspendMicrovmRate.paths=(kind == Deployment).spec.template.spec.containers.(name == kube-microvm-operator).env.(name == AWS_QUOTA_SUSPEND_MICROVM_RATE).value
quarkus.helm.values.quotas.suspendMicrovmRate.value=1
quarkus.helm.values.quotas.resumeMicrovmRate.paths=(kind == Deployment).spec.template.spec.containers.(name == kube-microvm-operator).env.(name == AWS_QUOTA_RESUME_MICROVM_RATE).value
quarkus.helm.values.quotas.resumeMicrovmRate.value=4
quarkus.helm.values.quotas.authTokenRate.paths=(kind == Deployment).spec.template.spec.containers.(name == kube-microvm-operator).env.(name == AWS_QUOTA_AUTH_TOKEN_RATE).value
quarkus.helm.values.quotas.authTokenRate.value=45
quarkus.helm.values.quotas.concurrentImageBuilds.paths=(kind == Deployment).spec.template.spec.containers.(name == kube-microvm-operator).env.(name == AWS_QUOTA_CONCURRENT_IMAGE_BUILDS).value
quarkus.helm.values.quotas.concurrentImageBuilds.value=9
quarkus.micrometer.export.prometheus.path=/q/metrics
# Disable ServiceMonitor generation — requires Prometheus Operator CRD which is not a hard dependency
quarkus.kubernetes.prometheus.generate-service-monitor=false
