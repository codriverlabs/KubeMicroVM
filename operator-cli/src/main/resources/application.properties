quarkus.application.name=microvm
# Binary output name for native builds
quarkus.package.output-name=microvm

# ── CLI output cleanliness ────────────────────────────────────────────────────
# Disable the Quarkus ASCII banner
quarkus.banner.enabled=false

# Suppress startup/shutdown INFO logs — CLI output should be clean
quarkus.log.category."io.quarkus".level=OFF
# Suppress Fabric8 warning about unstable CRD versions (v1alpha1 is expected)
quarkus.log.category."io.fabric8.kubernetes.client.dsl.internal.VersionUsageUtils".level=OFF
# Suppress general Fabric8 client noise
quarkus.log.category."io.fabric8".level=WARN
# Only show ERROR+ by default; application code can log to stderr explicitly
quarkus.log.level=ERROR
